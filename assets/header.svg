<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00e5ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="17" fill="none" stroke="#1f2937" stroke-width="2"/>

  <g opacity="0.16">
    <path d="M0 45 H1200 M0 90 H1200 M0 135 H1200 M0 180 H1200" stroke="#00e5ff" stroke-width="1"/>
    <path d="M120 0 V220 M240 0 V220 M360 0 V220 M480 0 V220 M600 0 V220 M720 0 V220 M840 0 V220 M960 0 V220 M1080 0 V220" stroke="#7c3aed" stroke-width="1"/>
  </g>

  <text x="600" y="92" text-anchor="middle"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, Monaco, monospace"
        font-size="54" font-weight="700" fill="#f8fafc">
    ORTIZDEV
  </text>

  <text x="600" y="132" text-anchor="middle"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, Monaco, monospace"
        font-size="22" font-weight="600" fill="#00e5ff">
    SOFTWARE DEVELOPMENT STUDENT
  </text>

  <text x="600" y="166" text-anchor="middle"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, Monaco, monospace"
        font-size="18" fill="#a7b0c0">
    Backend • Cloud • DevOps • Cybersecurity
  </text>

  <rect x="170" y="194" width="860" height="2" rx="1" fill="url(#line)" filter="url(#glow)"/>

  <circle cx="82" cy="38" r="5" fill="#00e5ff"/>
  <circle cx="98" cy="38" r="5" fill="#7c3aed"/>
  <circle cx="114" cy="38" r="5" fill="#22c55e"/>

  <text x="84" y="61"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, Monaco, monospace"
        font-size="11" fill="#64748b">
    ~/profile
  </text>
</svg>
